<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background USF Green Gradient -->
    <linearGradient id="usfGreenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a6b44"/>
      <stop offset="50%" stop-color="#005438"/>
      <stop offset="100%" stop-color="#013622"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#148a58" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#005438" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#005438" stop-opacity="0"/>
    </radialGradient>

    <!-- Official USF Gold Metallic Gradient -->
    <linearGradient id="usfGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="22%" stop-color="#ebd17b"/>
      <stop offset="58%" stop-color="#cfb53b"/>
      <stop offset="85%" stop-color="#a67e1c"/>
      <stop offset="100%" stop-color="#735209"/>
    </linearGradient>

    <!-- Gold Specular Highlight -->
    <linearGradient id="goldSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cloche Porcelain White Gradient -->
    <linearGradient id="clocheWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>

    <!-- Soft Cloche Specular -->
    <radialGradient id="clocheShine" cx="38%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Foreground Emblem -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00140c" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Tile -->
  <rect width="512" height="512" rx="116" fill="url(#usfGreenBg)"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="url(#usfGold)" stroke-width="7" opacity="0.45"/>

  <!-- 2. Master Emblem Group with Shadow -->
  <g filter="url(#emblemShadow)">

    <!-- Majestic Bull Horns (USF Horns Up Silhouette) -->
    <!-- Left Horn -->
    <path d="M 196 242
             C 156 246, 98 222, 72 166
             C 52 122, 64 68, 116 40
             C 126 34, 137 40, 133 56
             C 120 96, 133 140, 168 180
             C 188 202, 210 216, 220 226 Z"
          fill="url(#usfGold)"/>

    <!-- Right Horn -->
    <path d="M 316 242
             C 356 246, 414 222, 440 166
             C 460 122, 448 68, 396 40
             C 386 34, 375 40, 379 56
             C 392 96, 379 140, 344 180
             C 324 202, 302 216, 292 226 Z"
          fill="url(#usfGold)"/>

    <!-- Left Horn Tip Highlight -->
    <path d="M 116 40 C 126 34, 137 40, 133 56 C 125 84, 130 118, 150 148 C 134 130, 106 98, 116 40 Z" fill="url(#goldSpec)"/>

    <!-- Right Horn Tip Highlight -->
    <path d="M 396 40 C 386 34, 375 40, 379 56 C 387 84, 382 118, 362 148 C 378 130, 406 98, 396 40 Z" fill="url(#goldSpec)"/>

    <!-- Golden Rescue Sparkle between Horns -->
    <path d="M 256 86 
             Q 256 122, 276 132 
             Q 256 142, 256 178 
             Q 256 142, 236 132 
             Q 256 122, 256 86 Z" 
          fill="url(#usfGold)"/>

    <!-- Cloche Top Ring / Handle -->
    <ellipse cx="256" cy="192" rx="22" ry="14" fill="none" stroke="url(#usfGold)" stroke-width="8"/>
    <circle cx="256" cy="204" r="7" fill="url(#usfGold)"/>

    <!-- Cloche Food Dome (Fine Dining Rescue) -->
    <path d="M 142 348
             C 142 244, 194 204, 256 204
             C 318 204, 370 244, 370 348
             Z"
          fill="url(#clocheWhite)"/>

    <!-- Cloche Specular Sheen -->
    <path d="M 142 348
             C 142 244, 194 204, 256 204
             C 318 204, 370 244, 370 348
             Z"
          fill="url(#clocheShine)"/>

    <!-- Cloche Dome Gold Base Trim -->
    <path d="M 142 338 C 190 352, 322 352, 370 338 L 370 348 C 322 362, 190 362, 142 348 Z" fill="url(#usfGold)"/>

    <!-- Serving Platter Ellipse Base -->
    <ellipse cx="256" cy="364" rx="146" ry="24" fill="url(#usfGold)"/>
    <ellipse cx="256" cy="361" rx="140" ry="18" fill="url(#clocheWhite)"/>
    <ellipse cx="256" cy="359" rx="122" ry="12" fill="#ded7c7"/>

    <!-- Center Cutout Emblem: USF Green Dining Fork -->
    <!-- Handle -->
    <path d="M 253.5 272 L 258.5 272 L 257.5 324 C 257.5 328, 254.5 328, 254.5 324 Z" fill="#005438"/>
    <!-- Fork Base & Outer Tines -->
    <path d="M 239 240 
             L 243.5 240 
             L 243.5 264 
             C 243.5 273, 268.5 273, 268.5 264 
             L 268.5 240 
             L 273 240 
             L 273 264 
             C 273 279, 239 279, 239 264 Z" 
          fill="#005438"/>
    <!-- Center Tine -->
    <rect x="254" y="238" width="4" height="28" rx="2" fill="#005438"/>

    <!-- Fresh Sustainability Accent Leaf beside fork -->
    <path d="M 276 270 
             C 288 274, 296 288, 290 300 
             C 278 296, 274 282, 276 270 Z" 
          fill="#10b981"/>

  </g>
</svg>